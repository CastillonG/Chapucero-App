<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dice Coffee Adventure</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      background: #4f7b55;
    }

    /* ================================
       APP
    ================================= */

    .app {
      width: 100vw;
      height: 100vh;
      display: flex;
      position: relative;
    }

    /* ================================
       MAPA PRINCIPAL
    ================================= */

    .map-container {
      flex: 1;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,.05) 0 4px, transparent 5px),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,.04) 0 5px, transparent 6px),
        linear-gradient(
          180deg,
          #668c63,
          #547c58 40%,
          #466d4e 100%
        );
      scroll-behavior: smooth;
    }

    .map {
      position: relative;
      min-height: 1900px;
      width: 100%;
      max-width: 850px;
      margin: auto;
      padding-top: 80px;
    }

    /* ================================
       DECORACIONES DE CAFÉ
    ================================= */

    .coffee-decoration {
      position: absolute;
      opacity: 0.12;
      font-size: 55px;
      user-select: none;
      pointer-events: none;
    }

    .coffee-1 { top: 120px; left: 8%; transform: rotate(-15deg); }
    .coffee-2 { top: 380px; right: 10%; transform: rotate(20deg); }
    .coffee-3 { top: 650px; left: 12%; transform: rotate(18deg); }
    .coffee-4 { top: 910px; right: 12%; transform: rotate(-20deg); }
    .coffee-5 { top: 1180px; left: 10%; transform: rotate(-10deg); }
    .coffee-6 { top: 1450px; right: 11%; transform: rotate(10deg); }
    .coffee-7 { top: 1680px; left: 14%; transform: rotate(25deg); }

    /* ================================
       CAMINO
    ================================= */

    .path-line {
      position: absolute;
      width: 18px;
      height: 1700px;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0.15;
      background:
        repeating-linear-gradient(
          180deg,
          #f5e7c7 0 25px,
          transparent 25px 42px
        );
      border-radius: 30px;
      z-index: 1;
    }

    /* ================================
       NIVELES
    ================================= */

    .level {
      position: absolute;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: #eee5d0;
      border: 6px solid #fff7e5;
      box-shadow:
        0 8px 0 rgba(51, 69, 48, 0.35),
        0 12px 25px rgba(0,0,0,.15);
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 800;
      font-size: 22px;
      color: #58482f;
      cursor: pointer;
      z-index: 5;
      transition: .2s ease;
    }

    .level:hover {
      transform: scale(1.08);
    }

    .level.locked {
      background: #9ba89a;
      border-color: #bac4b8;
      color: #637061;
      filter: saturate(.5);
    }

    .level.current {
      background: #f2cc67;
      border-color: #fff2b4;
      box-shadow:
        0 8px 0 #9d7534,
        0 0 0 8px rgba(255, 227, 126, .22),
        0 12px 25px rgba(0,0,0,.18);
    }

    .level .lock {
      font-size: 25px;
    }

    /* Distribución serpiente */

    .level-10 { top: 120px; left: 48%; }
    .level-9  { top: 280px; left: 67%; }
    .level-8  { top: 445px; left: 52%; }
    .level-7  { top: 610px; left: 28%; }
    .level-6  { top: 775px; left: 42%; }
    .level-5  { top: 940px; left: 66%; }
    .level-4  { top: 1105px; left: 50%; }
    .level-3  { top: 1270px; left: 26%; }
    .level-2  { top: 1435px; left: 39%; }
    .level-1  { top: 1600px; left: 64%; }
    .level-0  { top: 1740px; left: 44%; }

    /* ================================
       PERSONAJE DADO
    ================================= */

    .character-wrapper {
      position: absolute;
      top: 1650px;
      left: calc(44% + 8px);
      width: 130px;
      height: 150px;
      z-index: 10;
      pointer-events: none;
    }

    .character {
      position: absolute;
      width: 80px;
      height: 80px;
      background: #f7eee0;
      border: 4px solid #4f4438;
      border-radius: 19px;
      left: 20px;
      top: 25px;
      box-shadow:
        inset -7px -7px 0 rgba(0,0,0,.06),
        0 7px 0 rgba(0,0,0,.16);
      transition: background .3s;
    }

    .dot {
      position: absolute;
      width: 11px;
      height: 11px;
      background: #493e33;
      border-radius: 50%;
    }

    .dot1 {
      top: 18px;
      left: 18px;
    }

    .dot2 {
      top: 34px;
      left: 34px;
    }

    .dot3 {
      bottom: 18px;
      right: 18px;
    }

    /* Cara */

    .eye {
      position: absolute;
      width: 6px;
      height: 9px;
      background: #26221d;
      border-radius: 50%;
      top: 51px;
      z-index: 10;
    }

    .eye-left {
      left: 26px;
    }

    .eye-right {
      right: 26px;
    }

    .mouth {
      position: absolute;
      width: 15px;
      height: 7px;
      border-bottom: 3px solid #26221d;
      border-radius: 50%;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    /* Brazos */

    .arm {
      position: absolute;
      width: 42px;
      height: 7px;
      background: #493e33;
      border-radius: 10px;
      top: 65px;
    }

    .arm-left {
      left: -14px;
      transform: rotate(-30deg);
    }

    .arm-right {
      right: -14px;
      transform: rotate(30deg);
    }

    .hand {
      position: absolute;
      width: 14px;
      height: 14px;
      background: #493e33;
      border-radius: 50%;
      top: -4px;
    }

    .arm-left .hand {
      left: -3px;
    }

    .arm-right .hand {
      right: -3px;
    }

    /* Piernas */

    .leg {
      position: absolute;
      width: 7px;
      height: 35px;
      background: #493e33;
      border-radius: 10px;
      bottom: -30px;
    }

    .leg-left {
      left: 21px;
      transform: rotate(7deg);
    }

    .leg-right {
      right: 21px;
      transform: rotate(-7deg);
    }

    .shoe {
      position: absolute;
      width: 21px;
      height: 10px;
      background: #493e33;
      border-radius: 50% 50% 40% 40%;
      bottom: -7px;
    }

    .leg-left .shoe {
      left: -7px;
    }

    .leg-right .shoe {
      right: -7px;
    }

    /* ================================
       ACCESORIOS PERSONAJE
    ================================= */

    .hat {
      position: absolute;
      width: 54px;
      height: 22px;
      background: #593d2b;
      border-radius: 20px 20px 5px 5px;
      top: -16px;
      left: 13px;
      display: none;
      z-index: 15;
    }

    .hat::after {
      content: "";
      position: absolute;
      width: 32px;
      height: 7px;
      background: #593d2b;
      border-radius: 10px;
      right: -18px;
      bottom: 0px;
    }

    .glasses {
      position: absolute;
      left: 14px;
      top: 44px;
      width: 52px;
      height: 16px;
      z-index: 15;
      display: none;
    }

    .glass {
      position: absolute;
      width: 20px;
      height: 15px;
      border: 3px solid #26221d;
      border-radius: 50%;
    }

    .glass.left {
      left: 0;
    }

    .glass.right {
      right: 0;
    }

    .glasses::after {
      content: "";
      position: absolute;
      width: 11px;
      height: 3px;
      background: #26221d;
      left: 21px;
      top: 6px;
    }

    /* ================================
       BOTÓN PERSONALIZAR
    ================================= */

    .customize-tab {
      position: fixed;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      width: 65px;
      height: 160px;
      border: none;
      border-radius: 25px 0 0 25px;
      background: #f3d887;
      box-shadow: -5px 6px 20px rgba(0,0,0,.18);
      cursor: pointer;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .customize-tab span {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #493c2c;
    }

    /* ================================
       PANEL PERSONALIZACIÓN
    ================================= */

    .customization-panel {
      position: fixed;
      top: 0;
      right: -370px;
      width: 360px;
      height: 100vh;
      background: #faf6ec;
      z-index: 200;
      transition: right .35s ease;
      box-shadow: -10px 0 30px rgba(0,0,0,.18);
      padding: 30px;
      overflow-y: auto;
    }

    .customization-panel.open {
      right: 0;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .panel-header h2 {
      color: #3e553f;
      font-size: 25px;
    }

    .close-panel {
      border: none;
      background: #e9e1cf;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }

    .preview {
      height: 190px;
      background: #dfe8d8;
      border-radius: 25px;
      margin-bottom: 25px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mini-character {
      transform: scale(1.1);
      position: relative;
      width: 80px;
      height: 80px;
    }

    .section-title {
      font-size: 14px;
      color: #746a5b;
      margin-bottom: 12px;
      margin-top: 22px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: bold;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .option {
      height: 80px;
      border-radius: 18px;
      border: 3px solid transparent;
      background: #eee8da;
      cursor: pointer;
      transition: .2s;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
    }

    .option:hover {
      transform: translateY(-3px);
    }

    .option.selected {
      border-color: #6b8b65;
      background: #e3eadc;
    }

    .color-dot {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,.7);
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }

    .cream { background: #f7eee0; }
    .yellow { background: #f4d47d; }
    .pink { background: #df9ba9; }
    .blue { background: #8bb7c8; }
    .green { background: #9eba94; }
    .brown { background: #ad7958; }

    /* ================================
       CABECERA MAPA
    ================================= */

    .map-title {
      position: fixed;
      top: 20px;
      left: 25px;
      background: rgba(248, 242, 225, .92);
      backdrop-filter: blur(10px);
      padding: 13px 20px;
      border-radius: 20px;
      z-index: 50;
      box-shadow: 0 8px 20px rgba(0,0,0,.1);
    }

    .map-title strong {
      display: block;
      color: #3e583f;
      font-size: 17px;
    }

    .map-title span {
      font-size: 12px;
      color: #756d61;
    }

    /* ================================
       MOBILE
    ================================= */

    @media(max-width: 650px) {

      .map {
        min-width: 100%;
      }

      .level {
        width: 65px;
        height: 65px;
        font-size: 18px;
      }

      .level-10 { left: 44%; }
      .level-9  { left: 66%; }
      .level-8  { left: 50%; }
      .level-7  { left: 20%; }
      .level-6  { left: 38%; }
      .level-5  { left: 66%; }
      .level-4  { left: 46%; }
      .level-3  { left: 19%; }
      .level-2  { left: 35%; }
      .level-1  { left: 65%; }
      .level-0  { left: 39%; }

      .character-wrapper {
        left: calc(39% - 5px);
      }

      .customize-tab {
        width: 50px;
      }

      .customization-panel {
        width: 90vw;
        right: -90vw;
      }

      .map-title {
        left: 14px;
        top: 14px;
      }
    }

  </style>
</head>

<body>

<div class="app">

  <!-- =========================
       MAPA
  ========================== -->

  <main class="map-container" id="mapContainer">

    <div class="map">

      <div class="map-title">
        <strong>☕ Ruta del Café</strong>
        <span>Nivel actual: 0</span>
      </div>

      <!-- Decoración -->
      <div class="coffee-decoration coffee-1">☕</div>
      <div class="coffee-decoration coffee-2">🫘</div>
      <div class="coffee-decoration coffee-3">☕</div>
      <div class="coffee-decoration coffee-4">🫘</div>
      <div class="coffee-decoration coffee-5">☕</div>
      <div class="coffee-decoration coffee-6">🫘</div>
      <div class="coffee-decoration coffee-7">☕</div>

      <div class="path-line"></div>

      <!-- Niveles superiores bloqueados -->

      <div class="level level-10 locked">
        <span class="lock">🔒</span>
      </div>

      <div class="level level-9 locked">
        <span class="lock">🔒</span>
      </div>

      <div class="level level-8 locked">
        <span class="lock">🔒</span>
      </div>

      <div class="level level-7 locked">
        <span class="lock">🔒</span>
      </div>

      <div class="level level-6 locked">
        <span class="lock">🔒</span>
      </div>

      <div class="level level-5 locked">
        <span class="lock">🔒</span>
      </div>

      <div class="level level-4 locked">
        <span class="lock">🔒</span>
      </div>

      <div class="level level-3 locked">
        <span class="lock">🔒</span>
      </div>

      <div class="level level-2 locked">
        <span class="lock">🔒</span>
      </div>

      <div class="level level-1">
        1
      </div>

      <div class="level level-0 current">
        0
      </div>

      <!-- PERSONAJE -->

      <div class="character-wrapper">

        <div class="character" id="mainCharacter">

          <div class="hat" id="mainHat"></div>

          <div class="glasses" id="mainGlasses">
            <div class="glass left"></div>
            <div class="glass right"></div>
          </div>

          <div class="dot dot1"></div>
          <div class="dot dot2"></div>
          <div class="dot dot3"></div>

          <div class="eye eye-left"></div>
          <div class="eye eye-right"></div>

          <div class="mouth"></div>

          <div class="arm arm-left">
            <div class="hand"></div>
          </div>

          <div class="arm arm-right">
            <div class="hand"></div>
          </div>

          <div class="leg leg-left">
            <div class="shoe"></div>
          </div>

          <div class="leg leg-right">
            <div class="shoe"></div>
          </div>

        </div>

      </div>

    </div>
  </main>

  <!-- BOTÓN LATERAL -->

  <button class="customize-tab" onclick="togglePanel()">
    <span>PERSONALIZAR ✦</span>
  </button>

  <!-- =========================
       PERSONALIZACIÓN
  ========================== -->

  <aside class="customization-panel" id="customPanel">

    <div class="panel-header">
      <h2>Tu dado</h2>

      <button class="close-panel" onclick="togglePanel()">
        ✕
      </button>
    </div>


    <div class="preview">

      <div class="mini-character">

        <div class="character" id="previewCharacter">

          <div class="hat" id="previewHat"></div>

          <div class="glasses" id="previewGlasses">
            <div class="glass left"></div>
            <div class="glass right"></div>
          </div>

          <div class="dot dot1"></div>
          <div class="dot dot2"></div>
          <div class="dot dot3"></div>

          <div class="eye eye-left"></div>
          <div class="eye eye-right"></div>

          <div class="mouth"></div>

          <div class="arm arm-left">
            <div class="hand"></div>
          </div>

          <div class="arm arm-right">
            <div class="hand"></div>
          </div>

          <div class="leg leg-left">
            <div class="shoe"></div>
          </div>

          <div class="leg leg-right">
            <div class="shoe"></div>
          </div>

        </div>

      </div>

    </div>


    <!-- COLOR -->

    <div class="section-title">
      Color del dado
    </div>

    <div class="options">

      <button class="option selected"
              onclick="changeColor('#f7eee0', this)">
        <div class="color-dot cream"></div>
      </button>

      <button class="option"
              onclick="changeColor('#f4d47d', this)">
        <div class="color-dot yellow"></div>
      </button>

      <button class="option"
              onclick="changeColor('#df9ba9', this)">
        <div class="color-dot pink"></div>
      </button>

      <button class="option"
              onclick="changeColor('#8bb7c8', this)">
        <div class="color-dot blue"></div>
      </button>

      <button class="option"
              onclick="changeColor('#9eba94', this)">
        <div class="color-dot green"></div>
      </button>

      <button class="option"
              onclick="changeColor('#ad7958', this)">
        <div class="color-dot brown"></div>
      </button>

    </div>


    <!-- CABEZA -->

    <div class="section-title">
      Cabeza
    </div>

    <div class="options">

      <button class="option selected"
              onclick="setHat(false, this)">
        ✕
      </button>

      <button class="option"
              onclick="setHat(true, this)">
        🧢
      </button>

      <button class="option">
        🔒
      </button>

    </div>


    <!-- CARA -->

    <div class="section-title">
      Accesorios
    </div>

    <div class="options">

      <button class="option selected"
              onclick="setGlasses(false, this)">
        ✕
      </button>

      <button class="option"
              onclick="setGlasses(true, this)">
        👓
      </button>

      <button class="option">
        🔒
      </button>

    </div>

  </aside>

</div>


<script>

  /* ================================
     ABRIR / CERRAR PANEL
  ================================= */

  function togglePanel() {

    const panel =
      document.getElementById("customPanel");

    panel.classList.toggle("open");

  }


  /* ================================
     CAMBIAR COLOR
  ================================= */

  function changeColor(color, button) {

    const main =
      document.getElementById("mainCharacter");

    const preview =
      document.getElementById("previewCharacter");

    main.style.background = color;
    preview.style.background = color;


    const siblings =
      button.parentElement.querySelectorAll(".option");

    siblings.forEach(el =>
      el.classList.remove("selected")
    );

    button.classList.add("selected");

  }


  /* ================================
     GORRA
  ================================= */

  function setHat(show, button) {

    const mainHat =
      document.getElementById("mainHat");

    const previewHat =
      document.getElementById("previewHat");


    mainHat.style.display =
      show ? "block" : "none";

    previewHat.style.display =
      show ? "block" : "none";


    const siblings =
      button.parentElement.querySelectorAll(".option");

    siblings.forEach(el =>
      el.classList.remove("selected")
    );

    button.classList.add("selected");

  }


  /* ================================
     LENTES
  ================================= */

  function setGlasses(show, button) {

    const main =
      document.getElementById("mainGlasses");

    const preview =
      document.getElementById("previewGlasses");


    main.style.display =
      show ? "block" : "none";

    preview.style.display =
      show ? "block" : "none";


    const siblings =
      button.parentElement.querySelectorAll(".option");

    siblings.forEach(el =>
      el.classList.remove("selected")
    );

    button.classList.add("selected");

  }


  /* ================================
     ABRIR MAPA EN LA PARTE INFERIOR
  ================================= */

  window.addEventListener("load", () => {

    const container =
      document.getElementById("mapContainer");

    container.scrollTop =
      container.scrollHeight;

  });

</script>

</body>
</html>
